# CAMELOT - Regno d'Acciaio
# Qualita + sicurezza + gate push (mypy/compileall/pip-audit) + normalizzazioni (LF/BOM/CRLF cmd)

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3

default_stages: [commit]

exclude: |
  (?x)(
    ^\.ruff_cache/|
    ^\.mypy_cache/|
    ^\.pytest_cache/|
    ^\.venv/|
    ^venv/|
    ^build/|
    ^dist/|
    ^node_modules/|
    ^site/|
    ^TPI_site_skeleton_.*
  )

repos:
  # 0) Local steel tools
  - repo: local
    hooks:
      - id: normalize-cmd-crlf
        name: Normalize cmd/bat to CRLF (auto-fix)
        language: system
        entry: python
        args: [ops/git/normalize_cmd_crlf.py]
        pass_filenames: true
        files: '\.(cmd|bat)$'

      - id: strip-utf8-bom
        name: Strip UTF-8 BOM (auto-fix, except csv)
        language: system
        entry: python
        args: [ops/git/strip_utf8_bom.py]
        pass_filenames: true
        files: '.'
        exclude: '\.(csv|png|jpg|jpeg|gif|pdf|zip|exe|apk)$'

      - id: guardian-merge-markers
        name: Guardian merge markers (push gate)
        language: system
        entry: pwsh -NoProfile -ExecutionPolicy Bypass -File ops/guardian_merge_markers.ps1
        pass_filenames: false
        always_run: true
        stages: [push]

      - id: mypy
        name: mypy (push gate)
        language: system
        entry: python -m mypy .
        pass_filenames: false
        stages: [push]

      - id: compileall
        name: compileall (push gate)
        language: system
        entry: python -B -m compileall -q .
        pass_filenames: false
        stages: [push]

      - id: pip-audit
        name: pip-audit (push gate)
        language: system
        entry: pip-audit -r requirements.txt
        pass_filenames: false
        stages: [push]

  # 1) Pre-commit hooks (igiene repo)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict

      - id: mixed-line-ending
        name: Normalize line endings to LF (except cmd/bat)
        args: [--fix=lf]
        exclude: '\.(cmd|bat)$'

      - id: end-of-file-fixer

      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      - id: check-byte-order-marker
        name: Block UTF-8 BOM (except csv)
        exclude: '\.csv$'

      - id: detect-private-key

      - id: check-added-large-files
        args: [--maxkb=2048]
        exclude: '^(data/big\.csv|data/dpi_import\.csv)$'

  # 2) Ruff (lint+format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 3) detect-secrets (baseline)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - '(^site/|^TPI_site_skeleton_.*|^\.ruff_cache/|^\.secrets\.baseline$)'
        pass_filenames: false
        stages: [commit, push]
