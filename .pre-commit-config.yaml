# .pre-commit-config.yaml
# Qualità + sicurezza repo TPI_evoluto
# Ordine: utility base → lint/format → sicurezza → quality gate locale (push)

minimum_pre_commit_version: "3.5.0"
default_language_version:
  python: python3

default_stages: [commit]

repos:
  # 1) Utility di base
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: Check YAML syntax

      - id: check-merge-conflict
        name: Block merge conflict markers

      - id: check-case-conflict
        name: Block case-conflict paths (Windows safe)

      # LF per tutto, ESCLUSI cmd/bat (su Linux i cmd in CRLF sono ok)
      - id: mixed-line-ending
        name: Normalize line endings to LF (except cmd/bat)
        args: [--fix=lf]
        exclude: '\.(cmd|bat)$'

      # CRLF SOLO per cmd/bat (evita “mixed line endings” in CI)
      - id: mixed-line-ending
        name: Normalize cmd/bat to CRLF
        args: [--fix=crlf]
        files: '\.(cmd|bat)$'

      - id: end-of-file-fixer
      - id: trailing-whitespace

      # BOM vietato (tranne csv, per non rompere dataset/export)
      - id: check-byte-order-marker
        name: Block UTF-8 BOM (except csv)
        exclude: '\.csv$'

      - id: detect-private-key
        name: Detect private keys

      - id: check-added-large-files
        name: Block large files (except known datasets)
        args: [--maxkb=2048]
        exclude: '^(data/big\.csv|data/dpi_import\.csv)$'

  # 2) Ruff: lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.1
    hooks:
      - id: ruff
        name: Ruff (lint + fix)
        args: [--fix]
      - id: ruff-format
        name: Ruff Format

  # 3) Sicurezza: detect-secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Detect secrets (baseline)
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - '(^site/|^TPI_site_skeleton_.*|^\.ruff_cache/|^\.secrets\.baseline$)'
        pass_filenames: false
        stages: [commit, push]

  # 4) Quality gate locale (solo su PUSH)
  - repo: local
    hooks:
      - id: mypy
        name: mypy (push gate)
        entry: python -m mypy .
        language: system
        pass_filenames: false
        stages: [push]

      - id: compileall
        name: compileall (push gate)
        entry: python -m compileall -q .
        language: system
        pass_filenames: false
        stages: [push]

      - id: pip-audit
        name: pip-audit (push gate)
        entry: pip-audit -r requirements.txt
        language: system
        pass_filenames: false
        stages: [push]
