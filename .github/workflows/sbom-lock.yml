name: sbom-lock

on:
  push:
    branches: ["main"]
    paths:
      - "requirements.txt"
      - "requirements.in"
      - ".github/workflows/sbom-lock.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements.in"
      - ".github/workflows/sbom-lock.yml"
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lockfile:
    name: sbom-lock/lockfile
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare input
        run: |
          set -e
          if [ -f requirements.in ]; then
            echo "requirements.in exists"
          else
            echo "requirements.in missing -> copy from requirements.txt"
            cp requirements.txt requirements.in
          fi

      - name: Compile lock (pip-tools)
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install "pip-tools>=7.4.1"
          pip-compile --generate-hashes -o requirements.lock.txt requirements.in

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock.txt

      - name: Summary
        if: always()
        run: |
          echo "### sbom-lock / lockfile" >> $GITHUB_STEP_SUMMARY
          if [ -f requirements.lock.txt ]; then
            echo "- ✅ requirements.lock.txt generated" >> $GITHUB_STEP_SUMMARY
            echo "- Lines: $(wc -l < requirements.lock.txt)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ requirements.lock.txt not generated" >> $GITHUB_STEP_SUMMARY
          fi

  sbom:
    name: sbom-lock/sbom
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Generate SBOM (CycloneDX)
        run: |
          set -e
          # Tool moderno + affidabile
          pip install "cyclonedx-bom>=4.6.0"
          # 1) tenta con requirements.lock.txt se presente (più deterministico)
          if [ -f requirements.lock.txt ]; then
            cyclonedx-py --format json --output sbom.json --requirements requirements.lock.txt
          else
            cyclonedx-py --format json --output sbom.json --requirements requirements.txt
          fi

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json

      - name: Summary
        if: always()
        run: |
          echo "### sbom-lock / sbom" >> $GITHUB_STEP_SUMMARY
          if [ -f sbom.json ]; then
            echo "- ✅ sbom.json generated" >> $GITHUB_STEP_SUMMARY
            echo "- Size: $(wc -c < sbom.json) bytes" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ sbom.json not generated" >> $GITHUB_STEP_SUMMARY
          fi
