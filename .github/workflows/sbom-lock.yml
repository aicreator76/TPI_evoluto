name: sbom-lock

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: python -m pip install pip-tools
      - name: Build lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f requirements.in || cp requirements.txt requirements.in
          pip-compile -q --generate-hashes -o requirements.lock.txt requirements.in
      - uses: actions/upload-artifact@v4
        with:
          name: lockfile
          path: requirements.lock.txt

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - name: Install deps (best-effort)
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt | tee -a sbom_install.log || true
          python -m pip install cyclonedx-bom | tee -a sbom_install.log
      - name: Generate SBOM (never fail)
        shell: bash
        run: |
          set -euo pipefail
          # prova standard; se fallisce crea placeholder
          cyclonedx-py --format json --output sbom.json --requirements requirements.txt \
            || echo '{}' > sbom.json
          test -s sbom.json || echo '{}' > sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.json
