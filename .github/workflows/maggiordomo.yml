name: Maggiordomo - Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 4 rotte (keep-alive + smoke)
        run: |
          set -e
          BASE="https://tpi-evoluto-staging.onrender.com"
          for path in /healthz /api/demo/products /api/linee-vita/products /api/inox/products; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              echo "FAIL: $path returned $code"
              exit 1
            fi
          done
