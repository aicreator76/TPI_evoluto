name: Camelot Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guardrail - no merge conflict markers
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          if (-not $root) { $root = "." }

          # SOLO marker reali (evita falsi positivi da =======)
          $bad = Select-String -Path "$root\**\*" -Pattern '<<<<<<<|>>>>>>>' -SimpleMatch -ErrorAction SilentlyContinue |
                 Select-Object -First 50

          if ($bad) {
            Write-Host "TROVATI MERGE MARKERS (prime righe):"
            $bad | ForEach-Object { Write-Host $\_.Path ":" $\_.LineNumber ":" $\_.Line }
            throw "FAIL: merge conflict markers presenti"
          }

          Write-Host "OK: nessun merge conflict marker trovato"

      - name: Guardrail - tiny artefacts trap (exe/apk)
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          if (-not $root) { $root = "." }

          $tinyWin = Get-ChildItem $root -Recurse -File -Filter "TPI_demo_WIN_*.exe" -ErrorAction SilentlyContinue |
                     Where-Object { $\_.Length -lt 51200 }

          $tinyApk = Get-ChildItem $root -Recurse -File -Filter "TPI_demo_APK_*.apk" -ErrorAction SilentlyContinue |
                     Where-Object { $\_.Length -lt 5000000 }

          if ($tinyWin) { Write-Host "TINY WIN:"; $tinyWin | Select FullName,Length | Format-Table -AutoSize }
          if ($tinyApk) { Write-Host "TINY APK:"; $tinyApk | Select FullName,Length | Format-Table -AutoSize }

          if ($tinyWin -or $tinyApk) { throw "FAIL: tiny artefacts trovati" }

          Write-Host ("OK: tiny trap win={0} apk={1}" -f @($tinyWin).Count, @($tinyApk).Count)

      - name: Render ping (keep-awake) [non-blocking]
        shell: pwsh
        continue-on-error: true
        run: |
          $u = "https://tpi-evoluto-staging.onrender.com/openapi.json"

          # Best-effort: se Render è lento/non raggiungibile NON deve bloccare la PR
          try {
            $r = Invoke-WebRequest -UseBasicParsing -Uri $u -TimeoutSec 45
            "OK Render ping code=" + $r.StatusCode
          } catch {
            Write-Host "::warning::Render ping failed (non-blocking): $($\_.Exception.Message)"
          }

      - name: Upload logs (if present)
        uses: actions/upload-artifact@v4
        with:
          name: camelot-logs
          path: |
            LOG\**
            RELEASE_TPI\**
            Cronache_Regina\**
          if-no-files-found: ignore
