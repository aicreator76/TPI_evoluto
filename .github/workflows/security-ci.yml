name: Security CI

on:
  push:
    branches: [ feat/catalogo-save ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Qui falliva perché in repo non c'è pyproject/setup.
      # Lo lasciamo best-effort ma NON deve rompere il job.
      - name: Install project (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install . || true

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit deps (JSON)
        run: |
          # Best effort: genera audit.json anche se trova roba
          pip-audit --progress-spinner off -f json -o audit.json || true

      - name: Fail only on HIGH/CRITICAL
        run: |
          python - <<'PY'
          import json, sys

          try:
              data = json.load(open("audit.json", encoding="utf-8"))
          except FileNotFoundError:
              print("audit.json missing (pip-audit did not produce output).")
              sys.exit(0)

          # Supporta più formati possibili (lista o dict)
          deps = data.get("dependencies", data) if isinstance(data, dict) else data

          hit = []
          for d in deps:
              if not isinstance(d, dict):
                  continue
              for v in (d.get("vulns") or []):
                  sev = (v.get("severity") or "UNKNOWN").upper()
                  if sev in {"HIGH", "CRITICAL"}:
                      hit.append((v.get("id"), sev, (v.get("description") or "")[:140]))

          if hit:
              print("High/Critical vulnerabilities found:")
              for vid, sev, desc in hit:
                  print(f"- {vid} {sev} {desc}")
              sys.exit(1)

          print("No HIGH/CRITICAL vulnerabilities found.")
          PY

      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-json
          path: audit.json
          if-no-files-found: ignore
