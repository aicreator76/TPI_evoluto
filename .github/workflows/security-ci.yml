name: Security CI

on:
  push:
    branches: [ feat/catalogo-save ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (best effort)
        run: |
          python -m pip install --upgrade pip
          pip install . || true

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit deps (JSON, high/critical only)
        shell: bash
        run: |
          set -e
          # esegue audit e fallisce solo se trova HIGH/CRITICAL
          pip-audit --progress-spinner off -f json -o audit.json --severity high || EXIT=$?
          if [ "${EXIT:-0}" -ne 0 ]; then
            echo "High/Critical vulnerabilities detected"
            exit 1
          fi

      - name: Upload audit report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-json
          path: audit.json
          if-no-files-found: ignore
