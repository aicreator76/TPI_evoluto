name: Docs

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "scripts/generate_openapi.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      -       - name: Generate OpenAPI schema (Render -> docs/openapi.json)
        run: |
          python scripts/generate_openapi.py
          test -s docs/openapi.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/openapi.json")
          data = json.loads(p.read_text(encoding="utf-8-sig"))
          paths = data.get("paths") or {}
          sync = data.get("x_sync_status", "ok")
          npaths = len(paths) if isinstance(paths, dict) else -1
          print(f"[INFO] openapi.json size={p.stat().st_size} paths={npaths} sync={sync}")

          # ENTERPRISE RULE:
          # - se backend sospeso/non raggiungibile: OK pubblicare placeholder (non fallire)
          # - se backend OK: pretendiamo paths > 0
          if sync in ("backend_unavailable", "backend_unreachable", "service_suspended"):
              print("[WARN] Backend unavailable/suspended: publishing placeholder OpenAPI.")
              raise SystemExit(0)

          if not isinstance(paths, dict) or len(paths) == 0:
              raise SystemExit("[ERR] OpenAPI has no paths while backend should be up. Failing build.")
          PY


      - name: Build MkDocs site (strict)
        run: mkdocs build --strict

      - name: Publish OpenAPI to site root
        run: |
          mkdir -p site
          cp -f docs/openapi.json site/openapi.json
          test -s site/openapi.json
          ls -la site | sed -n '1,200p'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
