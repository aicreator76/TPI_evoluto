name: Docs

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "scripts/generate_openapi.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Warm cache from GitHub Pages (best-effort)
        run: |
          mkdir -p docs
          curl -fsSL "https://aicreator76.github.io/TPI_evoluto/openapi.json" -o docs/openapi.json || true
          test -s docs/openapi.json && echo "[OK] cache loaded from Pages" || echo "[WARN] no cache on Pages"

      - name: Generate OpenAPI schema (Render -> docs/openapi.json)
        run: |
          python scripts/generate_openapi.py
          test -s docs/openapi.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("docs/openapi.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          st = d.get("x_sync_status")
          paths = d.get("paths") or {}

          # ENTERPRISE: placeholder/stale ok quando backend è down
          if st in ("service_suspended", "backend_unreachable", "stale"):
              print(f"[WARN] OpenAPI accepted (status={st}).")
              raise SystemExit(0)

          # Se NON è placeholder/stale: deve avere paths
          if not isinstance(paths, dict) or len(paths) == 0:
              print("[ERR] OpenAPI has no paths and is not acceptable status.", file=sys.stderr)
              raise SystemExit(2)

          print(f"[OK] OpenAPI OK paths={len(paths)} status={st}")
          PY

      - name: Build MkDocs site (strict -> site/)
        run: mkdocs build --strict --site-dir site

      - name: Publish OpenAPI to site root (guaranteed)
        run: |
          test -s docs/openapi.json
          cp -f docs/openapi.json site/openapi.json
          test -s site/openapi.json
          echo "[DBG] openapi.json in site:"
          find site -maxdepth 2 -name "openapi.json" -print -ls || true
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("site/openapi.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print("[OK] site/openapi.json", "status=", d.get("x_sync_status"), "paths=", len(d.get("paths") or {}))
          PY
          ls -la site | sed -n '1,200p'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
