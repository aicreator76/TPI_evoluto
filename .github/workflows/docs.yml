name: Docs

on:
  push:
    branches: [main]
    paths:
      - "mkdocs.yml"
      - "docs/**"
      - "scripts/generate_openapi.py"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Generate OpenAPI schema (Render -> docs/openapi.json)
        run: |
          python scripts/generate_openapi.py
          test -s docs/openapi.json
          python - <<'PY'
          import json, sys
          from pathlib import Path

          p = Path("docs/openapi.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          st = data.get("x_sync_status")
          paths = data.get("paths") or {}

          # Se Render è sospeso/non raggiungibile: accetta placeholder (enterprise = mai 404 su Pages)
          if st in ("service_suspended", "backend_unreachable"):
              print(f"[WARN] OpenAPI placeholder accepted (status={st}).")
              raise SystemExit(0)

          # Se NON è placeholder: deve avere endpoints veri
          if not isinstance(paths, dict) or len(paths) == 0:
              print("[ERR] OpenAPI has no paths and is not placeholder.", file=sys.stderr)
              raise SystemExit(2)

          print(f"[OK] openapi.json OK paths={len(paths)} status={st}")
          PY

      - name: Build MkDocs site (strict)
        run: mkdocs build --strict

      - name: Publish OpenAPI to site root
        run: |
          test -s docs/openapi.json
          cp -f docs/openapi.json site/openapi.json
          test -s site/openapi.json
          ls -la site | sed -n '1,200p'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4