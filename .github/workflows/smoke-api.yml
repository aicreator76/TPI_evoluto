name: smoke-api

on:
  pull_request:
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/smoke-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke-api / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      DATABASE_URL: "sqlite:///./ci.db"
      JWT_SECRET: "ci-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Python + pip info
        run: |
          python -V
          python -m pip --version

      - name: Install deps (best-effort)
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -U pip wheel setuptools | tee -a install.log || true
          python -m pip install -r requirements.txt | tee -a install.log || true
          # fallback minimo per garantire boot API
          python -m pip install fastapi "uvicorn[standard]" starlette pydantic curl-cffi | tee -a install.log || true
          python -m pip freeze | head -n 200 > freeze_head.log || true

      - name: Launch API
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 1
          echo "PID=$(cat uvicorn.pid)"

      - name: Wait for /openapi.json
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/openapi.json >/dev/null; then
              echo "API UP in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready. Last log:"
          tail -n 200 uvicorn.log || true
          exit 1

      - name: Probe /template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template

      - name: Probe /import (CSV) - template-driven
        shell: bash
        run: |
          set -euo pipefail

          header="$(curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template | head -n1 | tr -d '\r')"
          echo "TEMPLATE_HEADER=$header"

          # Costruisci una riga valida in base alle colonne richieste
          IFS=',' read -r -a cols <<< "$header"
          vals=()
          for c in "${cols[@]}"; do
            c="$(echo "$c" | xargs)"
            case "$c" in
              codice) vals+=("X") ;;
              nome|descrizione) vals+=("Desc") ;;
              scadenza|data|data_scadenza) vals+=("2099-12-31") ;;
              prezzo) vals+=("0") ;;
              gruppo|categoria) vals+=("dpi") ;;
              *) vals+=("X") ;;
            esac
          done
          row="$(IFS=','; echo "${vals[*]}")"

          csv_payload="${header}\n${row}\n"
          echo -e "$csv_payload" > smoke_import.csv
          echo "CSV_PAYLOAD:"
          cat smoke_import.csv
