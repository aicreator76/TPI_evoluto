name: smoke-api

on:
  pull_request:
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/smoke-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: smoke-api / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: "sqlite:///./ci.db"
      JWT_SECRET: "ci-secret"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_PYTHON_VERSION_WARNING: "1"
      PIP_DEFAULT_TIMEOUT: "60"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt

      - name: Python + pip info
        run: |
          python -V
          python -m pip --version

      - name: Install deps (strict -> fallback)
        run: |
          set -euo pipefail

          # Log unico
          python -m pip install -U pip wheel setuptools 2>&1 | tee install.log

          if python -m pip install --prefer-binary --progress-bar off -r requirements.txt 2>&1 | tee -a install.log; then
            echo "requirements.txt OK"
          else
            echo "requirements.txt FAILED -> fallback minimal deps" | tee -a install.log
            python -m pip install --prefer-binary --progress-bar off \
              fastapi "uvicorn[standard]" starlette pydantic \
              "SQLAlchemy>=2,<3" "aiosqlite>=0.20" 2>&1 | tee -a install.log
          fi

          python -m pip check || true
          python -m pip freeze | head -n 200 > freeze_head.log || true

          # Fail fast se non importa l'app
          python -c "import app.main; print('IMPORT app.main: OK')"

      - name: Smoke run (boot + probes + cleanup)
        run: |
          set -euo pipefail

          curl_opts=( -fsS --max-time 5 --retry 2 --retry-delay 1 )

          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn.log 2>&1 &
          PID="$!"
          echo "$PID" > uvicorn.pid
          echo "PID=$PID"

          cleanup() {
            echo "---- uvicorn (tail) ----"
            tail -n 200 uvicorn.log || true
            echo "------------------------"
            kill "$PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Wait openapi (max 60s)
          for i in {1..60}; do
            if curl "${curl_opts[@]}" http://127.0.0.1:8000/openapi.json >/dev/null; then
              echo "API UP in ${i}s"
              break
            fi
            if ! ps -p "$PID" >/dev/null 2>&1; then
              echo "uvicorn died early"
              exit 1
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "API did not become ready"
              exit 1
            fi
          done

          # Template
          curl "${curl_opts[@]}" http://127.0.0.1:8000/api/dpi/csv/template > template.csv
          header="$(head -n1 template.csv | tr -d '\r')"
          echo "TEMPLATE_HEADER=$header"

          IFS=',' read -r -a cols <<< "$header"
          vals=()
          for c in "${cols[@]}"; do
            c="$(echo "$c" | xargs)"
            case "$c" in
              codice) vals+=("X") ;;
              nome|descrizione) vals+=("Desc") ;;
              scadenza|data|data_scadenza) vals+=("2099-12-31") ;;
              prezzo) vals+=("0") ;;
              gruppo|categoria) vals+=("dpi") ;;
              *) vals+=("X") ;;
            esac
          done
          row="$(IFS=','; echo "${vals[*]}")"
          printf "%s\n%s\n" "$header" "$row" > smoke_import.csv

          # Import (robusto: 3 nomi campo file + stampa body se fallisce)
          url="http://127.0.0.1:8000/api/dpi/csv/import"
          ok=0

          for field in file csv upload; do
            resp="resp_${field}.txt"
            code="$(curl -sS -o "$resp" -w "%{http_code}" -X POST -F "${field}=@smoke_import.csv;type=text/csv" "$url" || true)"

            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              echo "IMPORT OK (field=$field http=$code)"
              ok=1
              break
            fi

            echo "IMPORT FAIL (field=$field http=$code) body(head):"
            head -n 40 "$resp" || true
          done

          [ "$ok" -eq 1 ]

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-logs-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            install.log
            freeze_head.log
            uvicorn.log
            template.csv
            smoke_import.csv
            resp_*.txt
