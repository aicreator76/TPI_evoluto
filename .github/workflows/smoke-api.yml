name: smoke-api

on:
  pull_request:
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/smoke-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke-api / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Python + pip info
        run: |
          python -V
          python -m pip --version

      # Install deps: best-effort ma con LOG completo
      - name: Install deps (best-effort)
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -U pip wheel setuptools | tee -a install.log || true
          python -m pip install -r requirements.txt | tee -a install.log || true
          # fallback minimo per garantire boot API
          python -m pip install fastapi "uvicorn[standard]" starlette pydantic curl-cffi | tee -a install.log || true
          python -m pip freeze | head -n 200 > freeze_head.log || true

      - name: CI env (safe defaults)
        shell: bash
        run: |
          echo "DATABASE_URL=sqlite:///./ci.db" >> "$GITHUB_ENV"
          echo "JWT_SECRET=ci-secret" >> "$GITHUB_ENV"
          echo "ENV=ci" >> "$GITHUB_ENV"

      - name: Launch API
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 1
          echo "PID=$(cat uvicorn.pid)"

      - name: Wait for /openapi.json
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/openapi.json >/dev/null; then
              echo "API UP in ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become ready. Last log:"
          tail -n 200 uvicorn.log || true
          exit 1

      - name: Probe /template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template

      - name: Probe /import (CSV) (template-driven)
        shell: bash
        run: |
          set -euo pipefail

          tmpl="$(curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template)"
          echo "TEMPLATE=$tmpl"

          headers="$tmpl"

          values="$(echo "$headers" | awk -F',' '{
            for (i=1;i<=NF;i++){
              h=$i
              if (h=="codice") v="X"
              else if (h=="nome" || h=="descrizione") v="Desc"
              else if (h=="scadenza" || h=="data") v="2030-01-01"
              else v=""
              printf "%s%s", v, (i<NF?FS:RS)
            }
          }')"

          pa
