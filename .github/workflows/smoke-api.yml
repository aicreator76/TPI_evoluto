name: smoke-api

on:
  pull_request:
    paths:
      - "app/**"
      - "requirements.txt"
      - ".github/workflows/smoke-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke-api / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 7

    env:
      DATABASE_URL: "sqlite:///./ci.db"
      JWT_SECRET: "ci-secret"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Python + pip info
        run: |
          python -V
          python -m pip --version

      - name: Install deps (strict -> fallback)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel setuptools | tee -a install.log

          if python -m pip install -r requirements.txt | tee -a install.log; then
            echo "requirements.txt OK"
          else
            echo "requirements.txt FAILED -> fallback minimal deps"
            python -m pip install \
              fastapi "uvicorn[standard]" starlette pydantic \
              SQLAlchemy aiosqlite \
              curl-cffi | tee -a install.log
          fi

          python -m pip freeze | head -n 200 > freeze_head.log || true
          python -m pip check || true

          # Fail fast se non importa l'app (evita curl loop inutile)
          python -c "import app.main; print('IMPORT app.main: OK')"

      - name: Launch API
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          sleep 1
          echo "PID=$(cat uvicorn.pid)"
          ps -p "$(cat uvicorn.pid)" >/dev/null

      - name: Wait for /openapi.json
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/openapi.json >/dev/null; then
              echo "API UP in ${i}s"
              exit 0
            fi
            # se il processo ÃƒÂ¨ morto, esci subito con log
            if ! ps -p "$(cat uvicorn.pid)" >/dev/null 2>&1; then
              echo "uvicorn died early. Last log:"
              tail -n 200 uvicorn.log || true
              exit 1
            fi
            sleep 1
          done
          echo "API did not become ready. Last log:"
          tail -n 200 uvicorn.log || true
          exit 1

      - name: Probe /template
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template

      - name: Probe /import (CSV) - template-driven
        shell: bash
        run: |
          set -euo pipefail

          header="$(curl -fsS --retry 2 --retry-delay 1 http://127.0.0.1:8000/api/dpi/csv/template | head -n1 | tr -d '\r')"
          echo "TEMPLATE_HEADER=$header"

          IFS=',' read -r -a cols <<< "$header"
          vals=()
          for c in "${cols[@]}"; do
            c="$(echo "$c" | xargs)"
            case "$c" in
              codice) vals+=("X") ;;
              nome|descrizione) vals+=("Desc") ;;
              scadenza|data|data_scadenza) vals+=("2099-12-31") ;;
              prezzo) vals+=("0") ;;
              gruppo|categoria) vals+=("dpi") ;;
              *) vals+=("X") ;;
            esac
          done
          row="$(IFS=','; echo "${vals[*]}")"

          printf "%s\n%s\n" "$header" "$row" > smoke_import.csv
          echo "CSV_PAYLOAD:"
          cat smoke_import.csv

          # endpoint import (default)
          url="http://127.0.0.1:8000/api/dpi/csv/import"

          # prova 3 nomi campo file (robusto)
          ok=0
          for field in file csv upload; do
            if curl -fsS --retry 1 --retry-delay 1 -X POST -F "${field}=@smoke_import.csv;type=text/csv" "$url" >/dev/null; then
              echo "IMPORT OK (field=$field)"
              ok=1
              break
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "IMPORT FAILED. Last uvicorn log:"
            tail -n 200 uvicorn.log || true
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api-logs
          path: |
            install.log
            freeze_head.log
            uvicorn.log
            smoke_import.csv
